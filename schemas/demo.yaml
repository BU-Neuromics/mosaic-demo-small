id: https://w3id.org/mosaic-demo-small/demo
name: mosaic-demo-small
version: 0.1.0
description: >-
  A small, self-contained Mosaic demo: fifteen entity classes modeling a
  simplified biobank/omics pipeline — a core chain of Donor, Sample, Workflow
  and Dataset, with clinical, governance, specimen-handling, instrumentation
  and publication collections around it. Deliberately independent of the
  brainbank-hippo-schema demo — built to exercise Aperture's faceting,
  full-text search and relationship traversal, and the planner's
  field-discovery, at a scale that's easy to scan and reason about, not a
  reduction of the larger schema.
prefixes:
  linkml: https://w3id.org/linkml/
  demo: https://w3id.org/mosaic-demo-small/
default_prefix: demo
default_range: string
imports:
  - linkml:types
  - hippo_core

classes:

  Donor:
    is_a: Entity
    description: >-
      An individual who contributed one or more biological samples.
    attributes:
      name:
        required: true
        description: Human-readable label for this donor.
      cohort:
        range: CohortEnum
        required: true
        description: Study cohort this donor belongs to (facet).
      sex:
        range: SexEnum
        required: true
        description: Donor's recorded sex (facet).
      age_at_death:
        range: integer
        required: true
        description: Donor's age at death, in years.
      history_of_rhi:
        range: boolean
        required: true
        description: >-
          Whether this donor has a documented history of repetitive head
          impacts (RHI) (facet).
      samples:
        range: Sample
        multivalued: true
        inverse: donor
        description: >-
          Samples collected from this donor — a virtual reverse edge over
          Sample.donor's stored FK (mosaic ADR-0011). Nothing is stored for it.
      cause_of_death:
        description: Free-text cause of death, when known (sparse — often unrecorded).
      diagnoses:
        range: Diagnosis
        multivalued: true
        inverse: donor
        description: >-
          Diagnoses recorded for this donor (virtual reverse edge).
      notes:
        description: >-
          Free-text intake notes. Full-text searchable — one of the fields
          used to exercise Aperture's search.
        annotations:
          hippo_search: fts5

  Sample:
    is_a: Entity
    description: >-
      A biological specimen collected from a single donor. Linked to its donor
      via a single-valued reference (a plain FK column, filterable in both
      directions by equality).
    attributes:
      name:
        required: true
        description: Human-readable label for this sample.
      donor:
        range: Donor
        required: true
        description: >-
          The donor this sample was collected from (single-valued reference —
          a real FK column; forward-resolved and reverse-queryable via an
          equality filter on this field).
      sample_type:
        range: SampleTypeEnum
        required: true
        description: Kind of biological material (facet).
      brain_region:
        range: BrainRegionEnum
        description: >-
          Anatomical brain region this sample was collected from (facet).
          Sparse/optional — only meaningful for `sample_type: tissue`
          samples; most other sample types have no brain region.
      storage_condition:
        range: StorageConditionEnum
        required: true
        description: How the sample is stored (facet).
      replicate_number:
        range: integer
        required: true
        description: >-
          Which technical replicate this is for its donor/sample_type
          combination. Deliberately skewed — most samples are replicate 1.
      accession:
        required: true
        description: >-
          Lab accession code. Exact-match lookup key, not meant for full-text
          search.
        annotations:
          hippo_index: true
      tags:
        multivalued: true
        description: Free-form labels (e.g. batch or shipment tags); sparse and variable in count.
      aliquots:
        range: Aliquot
        multivalued: true
        inverse: sample
        description: >-
          Aliquots drawn from this sample (virtual reverse edge).
      collected_at:
        range: date
        description: Date the sample was collected.

  Workflow:
    is_a: Entity
    description: >-
      A computational or laboratory pipeline run that consumes one or more
      samples and produces a dataset. Consumes samples via a multivalued
      reference — stored in Mosaic's `relationships` table, forward-resolved
      only (no reverse "which workflows consumed this sample" query exists).
    attributes:
      name:
        required: true
        description: Human-readable label for this workflow run.
      input_samples:
        range: Sample
        multivalued: true
        required: true
        description: >-
          Samples consumed by this workflow run (multivalued reference — a
          many-to-many edge; forward-resolved only).
      status:
        range: WorkflowStatusEnum
        required: true
        description: Current run status (facet). Heavily weighted toward completed.
      workflow_type:
        range: WorkflowTypeEnum
        required: true
        description: Kind of pipeline run (facet).
      started_at:
        range: datetime
        required: true
        description: When the workflow run started.
      completed_at:
        range: datetime
        description: >-
          When the workflow run finished. Sparse — approximately null for
          runs still queued/running (an approximation, not an enforced
          correlation with `status`).
      datasets:
        range: Dataset
        multivalued: true
        inverse: produced_by
        description: >-
          Datasets this workflow run produced (virtual reverse edge over
          Dataset.produced_by).
      duration_hours:
        range: float
        description: Wall-clock duration of the run, in hours, once complete.

  Dataset:
    is_a: Entity
    description: >-
      A data artifact produced by exactly one workflow run. Linked to its
      producing workflow via a single-valued reference (a plain FK column).
    attributes:
      name:
        required: true
        description: Human-readable label for this dataset.
      produced_by:
        range: Workflow
        required: true
        description: >-
          The workflow run that produced this dataset (single-valued
          reference — a real FK column; forward-resolved and
          reverse-queryable via an equality filter on this field).
      dataset_type:
        range: DatasetTypeEnum
        required: true
        description: Kind of data artifact (facet).
      access_level:
        range: AccessLevelEnum
        required: true
        description: Data access tier (facet).
      is_public:
        range: boolean
        required: true
        description: Whether this dataset is publicly released (boolean facet).
      description:
        description: >-
          Free-text description. Full-text searchable — the other field used
          to exercise Aperture's search.
        annotations:
          hippo_search: fts5
      file_size_bytes:
        range: float
        description: >-
          Size of the underlying data artifact, in bytes. `float`, not
          `integer` — GraphQL's `Int` scalar is 32-bit signed, and file
          sizes here realistically range into the tens of gigabytes.
      quality_metrics:
        range: QualityMetrics
        inlined: true
        description: >-
          Inlined quality-control metrics for this dataset (a value object,
          not its own entity — exercises the structured/JSON slot kind).

  ToxicologyReport:
    is_a: Entity
    description: >-
      A post-mortem toxicology screen run on a single donor. Not every donor
      has one — screens are ordered selectively, so this collection is
      deliberately sparser than its parent.
    attributes:
      name:
        required: true
        description: Human-readable label for this toxicology report.
      donor:
        range: Donor
        required: true
        description: >-
          The donor this screen was run on (single-valued reference — a real
          FK column).
      panel_type:
        range: ToxPanelTypeEnum
        required: true
        description: Which assay panel was run (facet).
      specimen_matrix:
        range: SpecimenMatrixEnum
        required: true
        description: >-
          The biological matrix the screen was run on (facet). Distinct from
          `Sample.sample_type` — this is what the toxicologist tested, not
          what was banked.
      substances_detected:
        multivalued: true
        description: >-
          Substances the panel returned above its reporting threshold, by
          common name (e.g. `ethanol`, `fentanyl`). Empty when the screen was
          negative.
      is_positive:
        range: boolean
        required: true
        description: Whether any substance was detected above threshold (boolean facet).
      reported_at:
        range: date
        description: Date the toxicology result was reported back.
      findings_summary:
        description: >-
          Free-text narrative of the toxicology findings. Full-text
          searchable.
        annotations:
          hippo_search: fts5

  Diagnosis:
    is_a: Entity
    description: >-
      A neuropathological diagnosis assigned to a donor. A donor may carry
      several, of which at most one is marked primary.
    annotations:
      # Mosaic derives bundle/accessor names as snake_case(ClassName) + "s",
      # which makes this one `diagnosiss`. `hippo_accessor` is the framework's
      # own override for exactly that case (hippo_ext.yaml names `analyses`
      # among its examples) — the only class in this schema that needs it.
      hippo_accessor: diagnoses
    attributes:
      name:
        required: true
        description: Human-readable label for this diagnosis record.
      donor:
        range: Donor
        required: true
        description: The donor this diagnosis was assigned to.
      condition_name:
        required: true
        description: >-
          Name of the diagnosed condition, as recorded by the
          neuropathologist.
      certainty:
        range: DiagnosisCertaintyEnum
        required: true
        description: How confidently the diagnosis was made (facet).
      braak_stage:
        range: integer
        description: >-
          Braak neurofibrillary tangle stage, 0–6. Specific to tau pathology
          — absent for diagnoses where it does not apply.
      is_primary:
        range: boolean
        required: true
        description: >-
          Whether this is the donor's primary diagnosis, as opposed to a
          contributing or incidental one (boolean facet).
      diagnosed_at:
        range: date
        description: Date the diagnosis was recorded.

  Assessment:
    is_a: Entity
    description: >-
      A cognitive or clinical assessment administered to a donor during life.
    attributes:
      name:
        required: true
        description: Human-readable label for this assessment.
      donor:
        range: Donor
        required: true
        description: The donor this assessment was administered to.
      instrument_name:
        range: AssessmentInstrumentEnum
        required: true
        description: >-
          Which standardised instrument was administered (facet). "Instrument"
          here is a clinical questionnaire — unrelated to the `Instrument`
          collection, which models laboratory hardware.
      raw_score:
        range: float
        required: true
        description: >-
          The instrument's raw total score, before any normalisation. Scales
          differ per instrument and are not comparable across them.
      percentile_rank:
        range: float
        description: >-
          Score expressed as a percentile against the instrument's reference
          population, where one is published.
      is_baseline:
        range: boolean
        required: true
        description: >-
          Whether this was the donor's first administration of this
          instrument (boolean facet).
      administered_at:
        range: date
        description: Date the assessment was administered.
      administered_by:
        description: Name or initials of the administering clinician.

  ConsentRecord:
    is_a: Entity
    description: >-
      A donor's recorded research consent, including withdrawal. Governance
      data — it constrains what may be done with the donor's samples and
      datasets rather than describing them.
    attributes:
      name:
        required: true
        description: Human-readable label for this consent record.
      donor:
        range: Donor
        required: true
        description: The donor who gave (or withdrew) this consent.
      scope:
        range: ConsentScopeEnum
        required: true
        description: What the donor consented their material to be used for (facet).
      signed_at:
        range: date
        required: true
        description: Date the consent was signed.
      withdrawn_at:
        range: date
        description: >-
          Date consent was withdrawn, when it was. Sparse — most consents are
          never withdrawn, and this is always later than `signed_at` when
          present.
      is_active:
        range: boolean
        required: true
        description: Whether this consent is currently in force (boolean facet).
      restrictions:
        description: >-
          Free-text description of any donor-specified restriction on use.

  Aliquot:
    is_a: Entity
    description: >-
      A sub-divided portion of a sample, tracked individually because
      freeze-thaw cycles and volume are per-portion rather than per-sample.
    attributes:
      name:
        required: true
        description: Human-readable label for this aliquot.
      sample:
        range: Sample
        required: true
        description: The sample this aliquot was divided from.
      location:
        range: StorageLocation
        required: true
        description: Where this aliquot is physically stored.
      volume_ul:
        range: float
        required: true
        description: Remaining volume, in microlitres.
      container_type:
        range: ContainerTypeEnum
        required: true
        description: Physical container the aliquot is held in (facet).
      thaw_count:
        range: integer
        required: true
        description: >-
          Number of freeze-thaw cycles this aliquot has undergone. Skewed —
          most aliquots have never been thawed.
      is_depleted:
        range: boolean
        required: true
        description: Whether the aliquot has been used up (boolean facet).
      notes:
        description: >-
          Free-text handling notes for this aliquot — thaw incidents,
          transfers, anything a technician recorded by hand.

  StorageLocation:
    is_a: Entity
    description: >-
      A physical storage position — a freezer, shelf and rack within a
      facility. A small dimension collection: many aliquots share few
      locations.
    attributes:
      name:
        required: true
        description: Human-readable label for this storage location.
      facility_type:
        range: FacilityTypeEnum
        required: true
        description: Kind of facility this location sits in (facet).
      freezer_id:
        required: true
        description: >-
          Asset tag of the freezer or cabinet. Exact-match lookup key, not
          meant for full-text search.
        annotations:
          hippo_index: true
      shelf:
        description: Shelf or rack position within the freezer.
      temperature_celsius:
        range: float
        required: true
        description: Set-point temperature of this location, in degrees Celsius.
      capacity_slots:
        range: integer
        description: Total number of aliquot positions this location holds.
      is_at_capacity:
        range: boolean
        required: true
        description: Whether the location is currently full (boolean facet).

  RunConfiguration:
    is_a: Entity
    description: >-
      The hardware, reagents and software a workflow run was executed with.
      Separate from `Workflow` because the same pipeline is re-run on
      different instruments and reagent lots over time.
    attributes:
      name:
        required: true
        description: Human-readable label for this run configuration.
      workflow:
        range: Workflow
        required: true
        description: The workflow run this configuration describes.
      instrument:
        range: Instrument
        required: true
        description: The instrument the run was executed on.
      reagent_lots:
        range: ReagentLot
        multivalued: true
        description: >-
          Reagent lots consumed by this run (multivalued reference — stored in
          Mosaic's `relationships` table, forward-resolved only).
      software_version:
        required: true
        description: >-
          Version string of the pipeline software, e.g. `2.14.1`. Exact-match
          lookup key.
        annotations:
          hippo_index: true
      parameter_preset:
        range: ParameterPresetEnum
        required: true
        description: Named parameter set the run was launched with (facet).
      compute_hours:
        range: float
        description: >-
          CPU-hours consumed by the run. Distinct from
          `Workflow.duration_hours`, which is wall-clock.
      is_reproducible:
        range: boolean
        required: true
        description: >-
          Whether every input needed to re-run this configuration is still
          available (boolean facet).

  Instrument:
    is_a: Entity
    description: >-
      A piece of laboratory hardware that workflow runs execute on. A small
      dimension collection.
    attributes:
      name:
        required: true
        description: Human-readable label for this instrument.
      platform:
        range: InstrumentPlatformEnum
        required: true
        description: Technology platform this instrument implements (facet).
      manufacturer:
        required: true
        description: Manufacturer name.
      model_name:
        required: true
        description: Manufacturer's model designation.
      serial_number:
        required: true
        description: >-
          Manufacturer serial number. Unique per instrument; exact-match
          lookup key.
        annotations:
          hippo_index: true
      commissioned_on:
        range: date
        description: Date the instrument entered service.
      is_decommissioned:
        range: boolean
        required: true
        description: Whether the instrument has been retired (boolean facet).
      notes:
        description: >-
          Free-text service notes for this instrument — calibration history,
          faults, engineer visits.

  ReagentLot:
    is_a: Entity
    description: >-
      A single manufactured lot of a laboratory reagent. Tracked because lot
      variation is a known source of batch effects.
    attributes:
      name:
        required: true
        description: Human-readable label for this reagent lot.
      lot_number:
        required: true
        description: >-
          Manufacturer lot number. Exact-match lookup key, not meant for
          full-text search.
        annotations:
          hippo_index: true
      vendor:
        required: true
        description: Supplier the lot was purchased from.
      reagent_kind:
        range: ReagentKindEnum
        required: true
        description: Category of reagent (facet).
      received_on:
        range: date
        required: true
        description: Date the lot was received into inventory.
      expires_on:
        range: date
        required: true
        description: >-
          Manufacturer expiry date. Always later than `received_on`.
      is_expired:
        range: boolean
        required: true
        description: Whether the lot is past its expiry date (boolean facet).

  QcFlag:
    is_a: Entity
    description: >-
      A quality-control problem raised against a dataset. Contrast with
      `Dataset.quality_metrics`, which is an inlined value object holding
      measurements — a flag is its own entity because it has a lifecycle.
    attributes:
      name:
        required: true
        description: Human-readable label for this QC flag.
      dataset:
        range: Dataset
        required: true
        description: The dataset this flag was raised against.
      flag_code:
        range: QcFlagCodeEnum
        required: true
        description: Which check produced the flag (facet).
      severity:
        range: QcSeverityEnum
        required: true
        description: How serious the flag is (facet).
      raised_at:
        range: datetime
        required: true
        description: When the flag was raised.
      resolved_at:
        range: datetime
        description: >-
          When the flag was resolved, if it has been. Sparse, and always
          later than `raised_at` when present.
      is_resolved:
        range: boolean
        required: true
        description: Whether the flag has been resolved (boolean facet).
      detail:
        description: >-
          Free-text explanation of what the check found. Full-text
          searchable.
        annotations:
          hippo_search: fts5

  Publication:
    is_a: Entity
    description: >-
      A published paper that used one or more of this bank's datasets. Cites
      datasets through a multivalued reference. A small dimension collection.
    attributes:
      name:
        required: true
        description: Human-readable label for this publication.
      title:
        required: true
        description: Full title of the paper.
      datasets:
        range: Dataset
        multivalued: true
        description: >-
          Datasets this paper used (multivalued reference — stored in
          Mosaic's `relationships` table, forward-resolved only).
      doi:
        required: true
        description: >-
          Digital Object Identifier. Exact-match lookup key, not meant for
          full-text search.
        annotations:
          hippo_index: true
      journal:
        required: true
        description: Name of the journal the paper appeared in.
      publication_type:
        range: PublicationTypeEnum
        required: true
        description: Kind of publication (facet).
      published_on:
        range: date
        description: Date of publication.
      is_open_access:
        range: boolean
        required: true
        description: Whether the paper is openly accessible (boolean facet).
      abstract_text:
        description: >-
          The paper's abstract. Full-text searchable.
        annotations:
          hippo_search: fts5

  QualityMetrics:
    description: >-
      Inlined quality-control measurements for a Dataset. Not an entity — has
      no identifier slot, so it is embedded as structured data rather than
      stored in its own table.
    attributes:
      read_count:
        range: integer
        description: Number of sequencing reads or records represented.
      mean_quality_score:
        range: float
        description: Mean per-base or per-record quality score.
      percent_duplicates:
        range: float
        description: Percentage of reads/records flagged as duplicates.

  ExternalID:
    abstract: true
    description: >-
      Override of hippo_core's deprecated ExternalID: this demo doesn't use
      the external-system-ID linking mechanism, and ExternalID (unlike
      Process/Validator/ReferenceLoader) isn't in Mosaic's own
      INFRASTRUCTURE_CLASSES exclusion list, so without this override it
      would show up as its own (permanently empty) Aperture collection.
      Marking it `abstract: true` here — a local redeclaration, which
      LinkML's import-merge semantics let win over hippo_core's imported
      shape — excludes it the same way any other value-typed/abstract
      class is excluded, with no changes to hippo_core.yaml or Aperture and
      no effect on this schema's own `is_a: Entity` classes.

enums:
  CohortEnum:
    description: Study cohort a donor was enrolled under.
    permissible_values:
      control:
        description: Control cohort — no disease/exposure of interest.
      case:
        description: Case cohort — carries the disease/exposure of interest.
      at_risk:
        description: At-risk cohort — elevated risk factors but not diagnosed.

  SexEnum:
    description: Donor's recorded sex.
    permissible_values:
      male:
      female:
      unknown:

  SampleTypeEnum:
    description: Kind of biological material a sample represents.
    permissible_values:
      blood:
      tissue:
      csf:
        description: Cerebrospinal fluid.
      urine:
      saliva:

  StorageConditionEnum:
    description: Physical storage condition of a sample.
    permissible_values:
      frozen:
      fresh:
      fixed:
        description: Chemically fixed (e.g. formalin).
      ambient:

  WorkflowStatusEnum:
    description: Lifecycle status of a workflow run.
    permissible_values:
      completed:
      failed:
      running:
      queued:
      cancelled:

  WorkflowTypeEnum:
    description: Category of computational pipeline.
    permissible_values:
      alignment:
      variant_calling:
      qc:
      quantification:
      rna_seq:
        description: RNA sequencing pipeline run.

  BrainRegionEnum:
    description: Anatomical brain region a tissue sample was collected from.
    permissible_values:
      hippocampus:
      frontal_cortex:
      cerebellum:
      brainstem:

  DatasetTypeEnum:
    description: Kind of data artifact.
    permissible_values:
      bam:
      vcf:
      counts_matrix:
      report:

  AccessLevelEnum:
    description: Data governance tier controlling who may access a dataset.
    permissible_values:
      public:
      controlled:
      restricted:

  ToxPanelTypeEnum:
    description: Assay panel run by a toxicology screen.
    permissible_values:
      basic_screen:
        description: Common drugs of abuse and alcohol.
      expanded_screen:
        description: Basic screen plus prescription and synthetic compounds.
      targeted_confirmation:
        description: Quantitative confirmation of a specific compound.
      heavy_metals:

  SpecimenMatrixEnum:
    description: >-
      Biological matrix a toxicology screen was run on. Distinct from
      SampleTypeEnum, which describes banked material rather than what was
      tested.
    permissible_values:
      blood:
      urine:
      vitreous_humour:
        description: Fluid from the eye — resistant to post-mortem redistribution.
      liver_tissue:
      hair:

  DiagnosisCertaintyEnum:
    description: Confidence with which a neuropathological diagnosis was made.
    permissible_values:
      definite:
      probable:
      possible:
      ruled_out:

  AssessmentInstrumentEnum:
    description: >-
      Standardised clinical instrument administered. A questionnaire, not
      laboratory hardware — see InstrumentPlatformEnum for the latter.
    permissible_values:
      mmse:
        description: Mini-Mental State Examination.
      moca:
        description: Montreal Cognitive Assessment.
      cdr:
        description: Clinical Dementia Rating.
      gds:
        description: Geriatric Depression Scale.
      npi:
        description: Neuropsychiatric Inventory.

  ConsentScopeEnum:
    description: What a donor consented their material to be used for.
    permissible_values:
      broad_research:
        description: Any research use, no further approval required.
      disease_specific:
        description: Research into the donor's own diagnosed condition only.
      no_commercial:
        description: Research use permitted, commercial exploitation excluded.
      withdrawn:
        description: Consent has been withdrawn; material may not be used.

  ContainerTypeEnum:
    description: Physical container an aliquot is held in.
    permissible_values:
      cryovial:
      microtube:
      plate_well:
      paraffin_block:

  FacilityTypeEnum:
    description: Kind of facility a storage location sits in.
    permissible_values:
      onsite_freezer:
      offsite_repository:
      liquid_nitrogen:
      ambient_archive:

  ParameterPresetEnum:
    description: Named parameter set a workflow run was launched with.
    permissible_values:
      default:
      high_sensitivity:
      fast:
      legacy:
        description: Parameters retained to reproduce historical runs.

  InstrumentPlatformEnum:
    description: Technology platform a laboratory instrument implements.
    permissible_values:
      illumina:
      pacbio:
      nanopore:
      mass_spec:
        description: Mass spectrometry.
      microscope:

  ReagentKindEnum:
    description: Category of laboratory reagent.
    permissible_values:
      library_prep:
      sequencing:
      extraction:
      staining:
      calibration:

  QcSeverityEnum:
    description: How serious a quality-control flag is.
    permissible_values:
      info:
      warning:
      critical:

  QcFlagCodeEnum:
    description: Which quality-control check produced a flag.
    permissible_values:
      low_coverage:
      high_duplication:
      adapter_contamination:
      sample_swap_suspected:
      failed_calibration:

  PublicationTypeEnum:
    description: Kind of publication.
    permissible_values:
      journal_article:
      preprint:
      review:
      conference_abstract:
