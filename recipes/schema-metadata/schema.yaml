id: https://w3id.org/datahelix/recipes/schema-metadata
name: schema_metadata
title: Schema self-description recipe
description: >-
  Makes a Mosaic deployment's own schema queryable, as ordinary entity types.

  A question like "what fields are available on datasets?" is asking for a
  TABLE of fields. A table is what a query returns. So rather than teaching the
  conversational surface a new kind of reply, this recipe describes the schema
  as data: one `SchemaEntityType` row per class, one `SchemaField` row per slot.
  The question then becomes an ordinary query — anchor `SchemaField`, filter
  `entity`, — answered and rendered by the same path as any other query.

  Nothing is special-cased to make this work. Mosaic's capability manifest is
  built by walking `registry.class_names()`, so these two classes become
  queryable, grounded in a planner's prompt, exposed over GraphQL, filterable,
  sortable and browsable the moment the recipe is applied.

  Notes for deployers:
    - The rows are DERIVED, never hand-authored. Regenerate them whenever the
      schema changes; a stale row is a description that lies with confidence.
      The generator that produces them is the recipe's companion, not part of
      the schema.
    - `SchemaField` mirrors Mosaic's own `SlotModel` attribute for attribute.
      That completeness is deliberate: without `kind` a reference cannot be
      told from a scalar, without `target_entity_type` a reference does not say
      what it points to, and without `role` a user's own fields cannot be told from
      the system's `id` / `is_available`. A partial description is a defect,
      not a simplification.
    - Class names are prefixed for the same reason `ApertureDocument` is: bare
      `Field` and `EntityType` are names a domain schema could plausibly want
      (a form builder, a survey tool, a data catalog), and a collision in a
      merged registry is painful to undo once rows exist.
    - The recipe does not describe ITSELF by default. Self-description is
      consistent but roughly doubles the rows and answers a question no
      researcher asked.

prefixes:
  linkml: https://w3id.org/linkml/

imports:
  - linkml:types
  - hippo_core

default_range: string

enums:

  SchemaSlotKind:
    description: >-
      How a slot is realized in storage and query. Mirrors Mosaic's own
      `SlotKind`; a description that flattened these to "a type string" would
      lose the distinction between a value and a link.
    permissible_values:
      scalar:
        description: A plain typed value — string, integer, float, boolean, date.
      enum:
        description: >-
          A value constrained to a fixed vocabulary. Its permissible values are
          carried in `enum_values`.
      reference:
        description: >-
          A link to another entity type, named in `target_entity_type`. Traversable
          in a query rather than filtered as a value.
      structured:
        description: >-
          An inlined value object — structured data belonging to this entity
          rather than a link to a separate one.

  SchemaFieldRole:
    description: >-
      Who a slot belongs to. The distinction a researcher needs in order to
      tell the fields someone authored from the ones the runtime supplies.
    permissible_values:
      user:
        description: Declared in the deployment's own schema.
      system:
        description: >-
          Supplied by the runtime for every entity (`id`, `is_available`).
          Present and queryable, but not part of the domain model.

classes:

  SchemaEntityType:
    is_a: Entity
    description: >-
      One entity type in the deployment's schema. `name` is the class name as
      the runtime and its query surface know it; `description` is whatever the
      schema author wrote for it.
    attributes:
      name:
        range: string
        required: true
        description: The class name, e.g. `Dataset` (equality-filtered).
        annotations:
          hippo_index: true
      description:
        range: string
        required: false
        description: >-
          The schema author's own description of this entity type. Free text —
          full-text searchable, so "which entity is about samples?" is
          answerable.
        annotations:
          hippo_search: fts5

  SchemaField:
    is_a: Entity
    description: >-
      One slot on one entity type, carrying every fact the runtime models about
      it. `id` is composed as `<EntityType>.<field>` so it is stable, readable
      and derivable — which is what makes regeneration idempotent.
    attributes:
      entity:
        range: SchemaEntityType
        required: true
        description: >-
          The entity type this slot belongs to. A real reference, so a query
          can traverse from a type to its fields and back.
        annotations:
          hippo_index: true
      name:
        range: string
        required: true
        description: >-
          The slot name as the schema declares it, e.g. `dataset_type`. Note
          this is the schema's spelling; a GraphQL surface may expose the same
          slot camelCased.
        annotations:
          hippo_index: true
      kind:
        range: SchemaSlotKind
        required: true
        description: Whether this slot holds a value, an enum, a link, or inlined data.
        annotations:
          hippo_index: true
      range:
        range: string
        required: true
        description: >-
          The slot's declared type, verbatim from the schema — e.g. `string`,
          `float`, `DatasetTypeEnum`, `Workflow`.
      role:
        range: SchemaFieldRole
        required: true
        description: Whether the schema author declared this slot or the runtime supplies it.
        annotations:
          hippo_index: true
      required:
        range: boolean
        required: true
        description: Whether a value must be present on every record.
      multivalued:
        range: boolean
        required: true
        description: Whether the slot holds many values rather than one.
      identifier:
        range: boolean
        required: true
        description: Whether this slot is the entity type's primary key.
      has_default:
        range: boolean
        required: true
        description: >-
          Whether the schema supplies a value when one is absent. Matters when
          reading a column that is never empty but was rarely authored.
      description:
        range: string
        required: false
        description: >-
          The schema author's own description of this slot — the sentence that
          says what the field actually means. Full-text searchable.
        annotations:
          hippo_search: fts5
      target_entity_type:
        range: string
        required: false
        description: >-
          For a reference or structured slot, the entity or value type it
          points at. Absent for scalars and enums.
      enum_name:
        range: string
        required: false
        description: For an enum slot, the name of its vocabulary.
      enum_values:
        range: string
        multivalued: true
        required: false
        description: >-
          For an enum slot, every value it accepts. This is what makes "what
          can this field contain?" answerable without reading the schema.
      is_external_xref:
        range: boolean
        required: true
        description: >-
          Whether this slot carries external-system reference pairs that act as
          globally unique reverse-lookup keys.
