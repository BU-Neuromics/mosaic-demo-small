id: org.datahelix.schema-metadata
name: schema_metadata
version: 0.1.0
description: >-
  Schema self-description: two entity types that make a deployment's own schema
  queryable, so "what fields are available on datasets?" is answered as an
  ordinary query rather than declined as out of scope.

  `SchemaEntityType` carries one row per class; `SchemaField` carries one row
  per slot, mirroring Mosaic's own `SlotModel` attribute for attribute so that
  no fact the runtime models is silently dropped.

  Rows are derived from the live schema by the recipe's companion generator and
  regenerated whenever the schema changes — they are a second representation of
  the schema, and a stale one describes data that no longer exists.

  Applies to any schema, not just the one it was written against: the generator
  walks the registry's own class list rather than any known set of entities.
